name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://ci.example.invalid
      AUTH_SECRET: ci-only-secret-value-with-more-than-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/mdldm_knowledge_kit_test
      PAYMENT_PROVIDER: manual
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-config
      - run: pnpm check:serverless
      - run: pnpm lint
      - run: pnpm typecheck
      - name: L1 schema and domain rules
        run: pnpm test:l1
      - name: L2 services and provider contracts
        run: pnpm test:l2
      - name: L3 API and security contracts
        run: pnpm test:l3
      - run: pnpm build
      - run: pnpm release:audit
      - run: pnpm audit --audit-level=moderate

  smoke:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AUTH_SECRET: ci-only-secret-value-with-more-than-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/mdldm_knowledge_kit_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm create-admin --name "Demo Admin" --email admin@example.com --password local-demo-admin-password-2026
      - run: pnpm seed-demo
      - run: pnpm exec playwright install --with-deps chromium
      - name: L4 user journeys
        run: pnpm test:l4
