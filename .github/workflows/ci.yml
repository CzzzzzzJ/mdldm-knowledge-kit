name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://ci.example.invalid
      AUTH_SECRET: ci-only-secret-value-with-more-than-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/mdldm_knowledge_kit_test
      PAYMENT_PROVIDER: manual
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-config
      - run: npm run check
      - run: npm run release:audit
      - run: npm audit --audit-level=moderate

  smoke:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AUTH_SECRET: ci-only-secret-value-with-more-than-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/mdldm_knowledge_kit_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run create-admin -- --name "Demo Admin" --email admin@example.com --password local-demo-admin-password-2026
      - run: npm run seed-demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
