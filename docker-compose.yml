# 本文件只为本地开发提供 MongoDB，不是生产部署或自维护 Docker 方案。
x-mdldm-scope: local-mongodb-only

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodb_data:
